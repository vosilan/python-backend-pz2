[flake8]
max-line-length = 79
max-complexity = 10
exclude = .venv,venv

[tool:pytest]
pythonpath = src
testpaths = tests

[coverage:run]
branch = True
source = src
omit =
    src/xzpack.py
    src/demo.py

[coverage:report]
show_missing = True
exclude_also =
    def main
    if __name__ == .__main__.:
    def compress
